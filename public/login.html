<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | ShopEase</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html">Shop<span>Ease</span></a>
    <form id="search-form" class="search-form">
      <input type="text" name="q" placeholder="Search products..." />
      <button type="submit">Search</button>
    </form>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="cart.html" class="cart-link">Cart <span id="cart-count" class="cart-count">0</span></a>
      <span id="auth-slot"></span>
    </nav>
  </div>
</header>

<main>
  <div class="form-card">
    <h1>Login</h1>
    <div id="form-msg"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit" class="btn block">Login</button>
    </form>
    <p class="form-footnote">Don't have an account? <a href="register.html">Register here</a></p>
  </div>
</main>

<footer class="site-footer">
  ShopEase — CodeAlpha Internship Project (Task 1: Simple E-commerce Store)
</footer>

<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
